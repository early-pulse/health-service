<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointment Cancellation</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #2c3e50;">Appointment Cancellation</h2>
        
        <p>Dear <span th:text="${appointment.userName}">User</span>,</p>
        
        <p>Your appointment has been cancelled:</p>
        
        <div style="background-color: #f8f9fa; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <p><strong>Date:</strong> <span th:text="${date}">Date</span></p>
            <p><strong>Time:</strong> <span th:text="${time}">Time</span></p>
            <p><strong>With:</strong> <span th:text="${entityName}">Entity Name</span></p>
            <p><strong>Type:</strong> <span th:text="${isLab ? 'Lab Test' : 'Doctor Consultation'}">Type</span></p>
        </div>
        
        <p>If you would like to schedule a new appointment, please visit our website or contact us.</p>
        
        <p>Best regards,<br>
        Health Service Team</p>
    </div>
</body>
</html>
